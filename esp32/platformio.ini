; B Fit · Aparelho de checklist (ESP32-2432S028R "Cheap Yellow Display")
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
  -DTFT_BL=21 -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DLOAD_GFXFF=1 -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000 -DSPI_READ_FREQUENCY=16000000
  -DCORE_DEBUG_LEVEL=0

; CYD original (1 USB micro): ILI9341
[env:cyd_ili9341]
build_flags = ${env.build_flags} -DILI9341_2_DRIVER=1 -DVARIANTE=\"ILI9341\"

; CYD "2USB" (micro + USB-C): ST7789
[env:cyd_st7789]
build_flags = ${env.build_flags} -DST7789_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=320 -DTFT_INVERSION_OFF=1 -DTFT_RGB_ORDER=TFT_RGB -DVARIANTE=\"ST7789\"
